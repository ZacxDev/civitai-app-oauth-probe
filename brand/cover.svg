<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16171a"/>
      <stop offset="0.55" stop-color="#1f2126"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="412">
      <stop offset="0" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#1c7ed6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- shield mark, left -->
  <g transform="translate(150 240) scale(0.82)">
    <path d="M256 104 L372 150 V262 C372 336 322 386 256 412 C190 386 140 336 140 262 V150 Z"
          fill="none" stroke="url(#mark)" stroke-width="26" stroke-linejoin="round"/>
    <circle cx="256" cy="238" r="34" fill="url(#mark)"/>
    <path d="M256 268 L256 330" stroke="url(#mark)" stroke-width="26" stroke-linecap="round"/>
  </g>

  <text x="620" y="392" fill="#f1f3f5"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="700">
    OAuth Probe
  </text>
  <text x="622" y="456" fill="#adb5bd"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="400">
    Which token this app holds, and what it may read.
  </text>

  <!-- the three readings, as a row of chips -->
  <g font-family="'SFMono-Regular', ui-monospace, monospace" font-size="27" fill="#4dabf7">
    <rect x="622" y="520" width="272" height="62" rx="12" fill="none" stroke="#343a40" stroke-width="2"/>
    <text x="650" y="559">token kind</text>
    <rect x="918" y="520" width="272" height="62" rx="12" fill="none" stroke="#343a40" stroke-width="2"/>
    <text x="946" y="559">tokenScope</text>
    <rect x="1214" y="520" width="238" height="62" rx="12" fill="none" stroke="#343a40" stroke-width="2"/>
    <text x="1242" y="559">withheld</text>
  </g>
</svg>
